services:
  - type: web
    name: nexia
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY_ENCRYPTION_KEY
        generateValue: true
      # Correo y contraseña del administrador inicial (se crea al arrancar).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Clave API de prueba compartida (opcional, también editable desde el panel).
      - key: TRIAL_API_KEY
        sync: false
      - key: API_BASE_URL
        value: https://api.mwapi.dev/v1
      - key: DAILY_MESSAGE_LIMIT
        value: "3"
      # OAuth de Google. APP_BASE_URL debe ser la URL pública de Render.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Recomendado en Render Free: Resend usa HTTPS, no los puertos SMTP bloqueados.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Alternativa para un servicio Render de pago. Gmail: smtp.gmail.com:587.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Nexia AI
      - key: SMTP_USE_TLS
        value: "true"
      - key: DEBUG_VERIFICATION_CODES
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      # Base de datos PostgreSQL gestionada por Render.
      - key: DATABASE_URL
        fromDatabase:
          name: nexia-db
          property: connectionString

databases:
  - name: nexia-db
    plan: free
    databaseName: nexia
    user: nexia
