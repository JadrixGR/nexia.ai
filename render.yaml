services:
  - type: web
    name: nexia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY_ENCRYPTION_KEY
        generateValue: true
      # Correo y contraseña del administrador inicial (se crea al arrancar).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Clave API de prueba compartida (opcional, también editable desde el panel).
      - key: TRIAL_API_KEY
        sync: false
      - key: API_BASE_URL
        value: https://api.mwapi.dev/v1
      - key: DAILY_MESSAGE_LIMIT
        value: "3"
      # OAuth de Google. APP_BASE_URL debe ser la URL pública de Render.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Base de datos PostgreSQL gestionada por Render.
      - key: DATABASE_URL
        fromDatabase:
          name: nexia-db
          property: connectionString

databases:
  - name: nexia-db
    plan: free
    databaseName: nexia
    user: nexia
